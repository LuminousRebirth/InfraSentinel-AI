[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "infrasentinel-ai"
version = "0.1.0"
description = "Local-first industrial visual detection, analysis and alerting platform"
readme = "README.md"
requires-python = ">=3.11,<3.12"

[project.scripts]
infrasentinel = "infrasentinel.cli:main"
vision-inspection = "vision_inspection.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires local Docker dependency services"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
